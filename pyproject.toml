[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "modulated-loglo-geothermal"
version = "0.1.0"
requires-python = ">=3.9"
dependencies = [
    "torch>=2.0",
    "numpy",
    "matplotlib",
    "pyyaml",
    "wandb",
    "neuraloperator @ git+https://github.com/neuraloperator/neuraloperator.git",
    "torchinfo",
    "pillow",
    "einops",
]

[tool.setuptools.packages.find]
include = ["training*", "models*", "losses*"]
