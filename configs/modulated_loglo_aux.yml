data:
  path: '../dataset_v3_hetero/'

model:
  type: modulated_loglo_aux
  in_dim: 8          # 4 state + 4 static; modulation encoder sees action + static only
  out_dim: 4
  lifting_dim: 256
  projection_dim: 256
  hidden_dim: 64
  n_blocks: 5
  action_channels: 6  # rate + mask + 4 static
  aux_hidden: [128, 64]

training:
  batch_size: 4
  lr: 1.0e-3
  num_epochs: 2000
  test_batch_size: 4
  weight_decay: 1.0e-4
  ema_decay: 0.9995
  log_every: 20
  grad_clip_norm: 1.0
  noise_alpha: [0.0025, 0.0025, 0.025, 0.025]
  use_pushforward: true
  pushforward_k_max: 12
  pushforward_k_step_interval: 5000
  warmup_steps: 3000
  cooldown_steps: 30000
  min_lr: 8.0e-5
  epochs_per_run: 500
  aux_start_step: 80000

loss:
  use_mse: true
  mse_weight: 5.0
  use_h1: true
  h1_weight: 2.0
  use_mbe: true
  mbe_weight: 3.0
  use_spectral: true
  spectral_weight: 3.0
  spectral_iLow: 2
  spectral_iHigh: 10
  aux_weight: 0.01
  use_mean_pressure: true
  mean_pressure_weight: 5.0
  channel_weights: [1.0, 1.0, 2.0, 2.0]

logging:
  writer: true
  wandb_project: "new_lr_scheme"
  wandb_entity: null
  watch_model: false
  log_scalar_every: 10

checkpoints:
  running_dir: "checkpoints/running/"
  final_path: "checkpoints/modulated_loglo_aux_hetero_final.pth"
  resume_path: "checkpoints/running/modulated_loglo_aux_hetero_resume.pt"
